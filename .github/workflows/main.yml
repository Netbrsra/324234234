name: Compilar Automatic Miner

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Dar permissao ao Gradle
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutomaticMiner-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
